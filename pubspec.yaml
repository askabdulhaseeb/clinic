name: ramzan
description: "Clinic management app: reception, doctors, admin."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cached_network_image: ^4.0.6
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  cupertino_icons: ^1.0.8
  file_picker: ^13.3.0
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  go_router: ^18.1.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  pdf: ^3.13.1
  printing: ^5.15.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  fake_async: ^1.3.3
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:

  uses-material-design: true

